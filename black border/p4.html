<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>黑水溝</title>
    <link rel="stylesheet" href="./CSS/p4.css" />
    <script src="./JS/p4.js" defer></script>
  </head>
  <body>
    <div class="questionContainer">
      <img src="./IMG/p4_text.png" class="text" />
      <a href="p5.html" class="nextbtn" id="nextbtn">
        <p>繼續航行</p>
      </a>
    </div>
    <div class="rain-container">
      <img src="./IMG/p4_rain.png" class="rain" />
    </div>
    <div class="ocean-container" id="scene">
      <div class="wave4 parallax-layer" data-speed="90">
        <img src="./IMG/index_wave8.png" class="waveimg" />
      </div>
      <div class="wave3 parallax-layer" data-speed="80">
        <img src="./IMG/index_wave7.png" class="waveimg" />
      </div>
      <div class="boat parallax-layer" data-speed="70">
        <div class="opta">
          <input type="radio" name="p4" id="opta" />
          <label for="opta">
            <div class="a">
              <img src="./IMG/index_boat.png" class="boatimg" />
              <img src="./IMG/p4_dropa.png" class="infoimg" />
            </div>
          </label>
        </div>
        <div class="optb">
          <input type="radio" name="p4" id="optb" />
          <label for="optb">
            <div class="b">
              <img src="./IMG/index_boat.png" class="boatimg" />
              <img src="./IMG/p4_dropb.png" class="infoimg" />
            </div>
          </label>
        </div>
        <div class="optc">
          <input type="radio" name="p4" id="optc" />
          <label for="optc">
            <div class="c">
              <img src="./IMG/index_boat.png" class="boatimg" />
              <img src="./IMG/p4_dropc.png" class="infoimg" />
            </div>
          </label>
        </div>
      </div>
      <div class="wave2 parallax-layer" data-speed="60">
        <img src="./IMG/index_wave6.png" class="waveimg" />
      </div>
      <div class="wave1 parallax-layer" data-speed="50">
        <img src="./IMG/index_wave4.png" class="waveimg" />
      </div>
      <div class="hor3 parallax-layer" data-speed="40">
        <img src="./IMG/index_horizon3.png" class="waveimg" />
      </div>
      <div class="isl2 parallax-layer" data-speed="30">
        <img src="./IMG/index_island2.png" />
      </div>
    </div>
    <script src="./JS/p4.js"></script>
  </body>
</html>
